jwt.secret=your-secret-key-change-in-production
jwt.access.expiration.minutes=30
jwt.refresh.expiration.minutes=10080

spring.application.name=backend
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=changemeinprod!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true 

spring.sql.init.mode=always
spring.datasource.initialization-mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.config.import=optional:file:.env[.properties]

# Environment variables for seed data
seed.data.consultationServiceId=${CONSULTATION_SERVICE_ID}
seed.data.ultrasoundServiceId=${ULTRASOUND_SERVICE_ID}
seed.data.consultationProtocolId=${CONSULTATION_PROTOCOL_ID}
seed.data.consultationPhaseId=${CONSULTATION_PHASE_ID}
seed.data.consultationProtocolServiceId=${CONSULTATION_PROTOCOL_SERVICE_ID}
seed.data.ultrasoundProtocolServiceId=${ULTRASOUND_PROTOCOL_SERVICE_ID}

spring.profiles.active=local